# Compose project name. This is the prefix Docker applies to every resource it
# creates for this stack (networks, volumes, default container names). Setting
# it here pins the prefix to `sticks` regardless of the folder name, so every
# resource shows up as `sticks-*` / `sticks_*` in `docker ps` and the Desktop UI.
name: sticks

# ============================================================
# STATIC NETWORK CONFIGURATION  (CONTAINED-BY-DEFAULT)
# ============================================================
# The attack/target lab lives ONLY on `internal: true` networks. Those networks
# have no gateway to the host or the internet, so the adversary emulation cannot
# reach the host or escape to the outside world on ANY machine (including a work
# laptop). `internal: true` affects RUNTIME only — `docker build` still uses
# Docker's default build network, so the Dockerfiles build normally.
#
# Naming convention:
#   -attacker  -> adversary side (caldera-attacker C2, kali-attacker node)
#   -target    -> victim side (nginx-target web, mariadb-target backend)
#
# ONLY published host port on the lab: caldera-attacker 8888 (UI + API at
# localhost:8888). mariadb-target / nginx-target / kali-attacker publish NO host
# ports. No external DNS on lab services.
#
# caldera-attacker ALSO joins `caldera-mgmt-network` (a bridge, NOT internal).
# Docker only publishes host ports when a container is on at least one
# non-internal network, so this management bridge is what actually exposes 8888
# to the host. It carries only Caldera's control channel; the other lab services
# remain internal-only with no host or internet access. The service keeps the
# network alias `caldera` so the kali agent's `http://caldera:8888` still works.
#
# NETWORK                SUBNET            HOST               IP           (internal)
# ------------------------------------------------------------
# caldera-kali-network   192.168.10.0/24   caldera-attacker   192.168.10.10   yes
# caldera-kali-network   192.168.10.0/24   kali-attacker      192.168.10.20   yes
# caldera-mgmt-network   192.168.40.0/24   caldera-attacker   (dynamic)       no
#
# kali-nginx-network     192.168.20.0/24   kali-attacker      192.168.20.20   yes
# kali-nginx-network     192.168.20.0/24   nginx-target       192.168.20.30   yes
#
# nginx-db-network       192.168.30.0/24   nginx-target       192.168.30.30   yes
# nginx-db-network       192.168.30.0/24   mariadb-target     192.168.30.40   yes
#
# APPLICATION LAYER (Pipeline_UI): frontend/backend/postgres on `app-network`
# (bridge) ONLY — unchanged, separate from the attack lab.
# ============================================================

services:
  # DATABASE - Only accessible by Nginx
  # Lab TARGET backend (SUT-B). Despite the legacy "db" name, the engine is
  # MariaDB (not MySQL) and the container also serves web content on :80.
  mariadb-target:
    build: .docker/db
    image: sticks-mariadb-target:latest
    container_name: sticks-mariadb-target
    hostname: db  # keep internal hostname `db`; attack scripts target it by fixed IP
    #restart: always
    tty: true
    volumes:
      - sticks-mariadb-target-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    networks:
      nginx-db-network:
        ipv4_address: 192.168.30.40  # Fixed IP inside 192.168.30.0/24 (internal-only)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 4m

  # NGINX - Lab TARGET web server (SUT-A). The primary web attack target.
  nginx-target:
    build: .docker/nginx
    image: sticks-nginx-target:latest
    container_name: sticks-nginx-target
    hostname: nginx  # keep internal hostname `nginx`; nothing resolves it, but harmless
    volumes:
      - ./.docker/nginx/var/www/html:/var/www/html
    networks:
      nginx-db-network:
        ipv4_address: 192.168.30.30  # Fixed IP for DB communication
      kali-nginx-network:
        ipv4_address: 192.168.20.30  # Fixed IP for Kali ↔ Nginx communication
    depends_on:
      mariadb-target:
        condition: service_healthy
    restart: unless-stopped

  # CALDERA - Red Team C2 Platform (attacker-side: orchestrates the emulation).
  caldera-attacker:
    build: .docker/caldera
    image: sticks-caldera-attacker:latest
    container_name: sticks-caldera-attacker
    # NOTE: no --build — the magma UI is already compiled into the image (ui-build stage). Running the UI build at runtime fails (ENOTEMPTY) due to the source bind-mount.
    entrypoint:
      - python3
      - server.py
      - --insecure
    ports:
      # Bound to 127.0.0.1 so ONLY this machine can reach Caldera's UI/API.
      # Other hosts on the LAN cannot connect.
      - "127.0.0.1:8888:8888"
    # NOTE: the previous bind-mount (./.docker/caldera:/usr/src/app) was REMOVED.
    # It overlaid the image's /usr/src/app with the host dir, which (a) hid the
    # UI compiled into the image (magma/dist) so the 8888 web server never
    # started, and (b) forced os.walk over the huge atomic-red-team tree through
    # Docker Desktop's slow Windows->Linux FS layer, stalling ability
    # verification at boot. The image already contains the code, the compiled UI
    # and the plugin data, so no mount is needed.
    environment:
      - TZ=America/New_York
      - CALDERA_SSL=false
    networks:
      caldera-kali-network:
        ipv4_address: 192.168.10.10  # Fixed IP inside Caldera-Kali network (attack plane)
        # Keep the DNS name `caldera` on this network so the kali agent's
        # `http://caldera:8888` beacon keeps resolving after the service rename.
        aliases:
          - caldera
      caldera-mgmt-network: {}     # Management plane: lets 8888 publish to the host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'KEY: ADMIN123' http://localhost:8888/api/v2/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m

  # KALI LINUX - Attacker node (runs the sandcat agent that beacons to Caldera).
  kali-attacker:
    build:
      context: .docker/kali
      dockerfile: Dockerfile
    image: sticks-kali-attacker:latest
    container_name: sticks-kali-attacker
    hostname: kali-attacker
    volumes:
      # Bind-mount (NOT a named volume): kali-data/ is version-controlled in the
      # repo and ships attack artifacts (e.g. malware.bin) that the campaigns
      # expect under /root. A named volume would hide those tracked files.
      - ./kali-data:/root
    networks:
      caldera-kali-network:
        ipv4_address: 192.168.10.20  # Fixed IP for communication with Caldera (internal-only)
      kali-nginx-network:
        ipv4_address: 192.168.20.20  # Fixed IP for communication with Nginx (internal-only)
    # Minimal capabilities for contained emulation: NET_RAW lets nmap/ping use
    # raw sockets. NET_ADMIN/SYS_ADMIN and privileged mode removed — not needed
    # for scanning the target inside the internal networks, and dropping them
    # shrinks the blast radius if the attacker container is compromised.
    cap_add:
      - NET_RAW
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ============================================================
  # APPLICATION LAYER (Pipeline_UI) — NOT part of the attack lab
  # ------------------------------------------------------------
  # frontend, backend and banco live on the application-layer bridge
  # network `app-network` ONLY. They MUST NOT join the internal attack
  # networks (caldera-kali-network / kali-nginx-network / nginx-db-network,
  # all `internal: true`). The backend reaches Caldera exclusively via the
  # host (localhost:8888 -> host.docker.internal:8888) and reads the Docker
  # Engine API (socket, read-only) purely to inspect container isolation.
  # ============================================================

  # BANCO - Application database (PostgreSQL) for the Pipeline_UI.
  # PostgreSQL is the ONLY database the project uses (no SQLite). Native host
  # dev reaches it via the published loopback port below; the containerized
  # `backend` service reaches it over the compose network at `postgres:5432`.
  postgres:
    image: postgres:16-alpine
    container_name: sticks-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: pipeline_ui
      POSTGRES_USER: pipeline_ui
      POSTGRES_PASSWORD: pipeline_ui
    ports:
      # Bound to 127.0.0.1 so ONLY this machine can reach Postgres. This lets
      # the native (host) backend dev server connect at localhost:5432.
      - "127.0.0.1:5432:5432"
    volumes:
      - sticks-postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline_ui -d pipeline_ui"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # BACKEND - FastAPI service that orchestrates the pipeline and applies
  # containment checks. Talks to Caldera ONLY via localhost:8888 and reads the
  # Docker socket read-only for isolation inspection.
  #
  # OPT-IN (containerized fallback): assigned to the `containers` profile, so a
  # plain `docker compose up -d` does NOT start it. The default dev workflow
  # runs the backend natively on the host with hot-reload (uvicorn --reload).
  # Start the containerized version explicitly with:
  #   docker compose --profile containers up -d frontend backend
  backend:
    profiles: ["containers"]
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    container_name: sticks-backend
    hostname: pipeline-ui-backend
    working_dir: /repo/apps/backend
    # Apply DB migrations before serving, so a fresh Postgres volume always has
    # the schema (otherwise `GET /api/campaigns` 500s on a missing table).
    command:
      - sh
      - -c
      - "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /repo/apps/backend/app"
    environment:
      # Point the backend at the `postgres` PostgreSQL service when run via compose.
      PIPELINE_UI_DATABASE_URL: postgresql+psycopg://pipeline_ui:pipeline_ui@postgres:5432/pipeline_ui
      PIPELINE_UI_ENVIRONMENT: development
      # STIX bundle cache INSIDE the container, persisted in a named volume
      # (sticks-stix-cache). Overrides the OS default so the download lands on
      # the cache volume instead of the repo tree.
      PIPELINE_UI_STIX_DIR: /var/cache/sticks/stix
    ports:
      # Bound to 127.0.0.1 so ONLY this machine can reach the backend API.
      # host 8010 -> container 8000 (8000 is taken by nginx inside the lab).
      - "127.0.0.1:8010:8000"
    volumes:
      # Mount the repo root read-only so app/core/sticks_config.py can resolve
      # <repo>/packages/cli/config/config.py via parents[4] at runtime. The STIX
      # download no longer writes under /repo, so the whole tree stays :ro.
      - ../..:/repo:ro
      # STIX cache volume (persists across container recreations and is reused,
      # avoiding re-download). Replaces the old bind in packages/cli/data/stix;
      # the backend writes the bundle here via PIPELINE_UI_STIX_DIR.
      - sticks-stix-cache:/var/cache/sticks/stix
      # Docker Engine API, READ-ONLY, for isolation inspection only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      # Let `localhost:8888` semantics resolve to the host running Caldera's
      # published port. The backend uses host.docker.internal:8888.
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # FRONTEND - React + TypeScript SPA (Vite DEV server with HMR). Application
  # layer only. Instead of baking a production bundle and serving it with
  # `vite preview` (which required an image rebuild on every edit), this runs
  # the Vite dev server directly against the bind-mounted source so edits
  # hot-reload in the browser. VITE_* are read at dev-server start, so the
  # browser still calls the backend at the host port :8010.
  #
  # OPT-IN (containerized fallback): assigned to the `containers` profile, so a
  # plain `docker compose up -d` does NOT start it. The default dev workflow
  # runs the frontend natively on the host with hot-reload (vite dev server).
  # Start the containerized version explicitly with:
  #   docker compose --profile containers up -d frontend backend
  frontend:
    profiles: ["containers"]
    image: node:20-slim
    container_name: sticks-frontend
    working_dir: /app
    # Install deps on first boot (into the named node_modules volume) then start
    # the Vite dev server. --host 0.0.0.0 so the published port is reachable;
    # --port 4173 keeps the existing 8080:4173 host mapping valid.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 4173"
    environment:
      VITE_API_BASE_URL: http://localhost:8010/api
      VITE_WS_BASE_URL: ws://localhost:8010
    ports:
      # Bound to 127.0.0.1 so ONLY this machine can open the UI.
      # host 8080 -> container 4173 (vite dev server).
      - "127.0.0.1:8080:4173"
    volumes:
      # Bind-mount the frontend source so edits hot-reload without a rebuild.
      - ../../apps/frontend:/app
      # Named volume for node_modules so the container's installed deps are not
      # shadowed by the (dep-free) host source mount.
      - sticks-frontend-node-modules:/app/node_modules
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped


# NETWORK CONFIGURATION
# hierarquical configuration: localhost -> caldera -> kali -> nginx -> db

networks:
  # APPLICATION LAYER: frontend <-> backend <-> banco ONLY.
  # NOT internal, and separate from the three attack networks. The application
  # services never join caldera-kali/kali-nginx/nginx-db networks.
  app-network:
    name: sticks-app-network
    driver: bridge

  # C2 MANAGEMENT PLANE: publishes Caldera's UI/API (8888) to the host.
  # This is NOT internal, so the host (browser + backend on Windows) can reach
  # Caldera. It carries ONLY the Caldera control channel — the attacker (kali)
  # and targets (nginx, db) stay on their internal-only networks with no host
  # or internet access. Only Caldera joins this bridge.
  caldera-mgmt-network:
    name: sticks-caldera-mgmt-network
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.40.0/24
          gateway: 192.168.40.1

  # 1. PRIVATE: Caldera ↔ Kali ONLY
  caldera-kali-network:
    name: sticks-caldera-kali-network
    driver: bridge
    internal: true  # No external access
    ipam:
      config:
        - subnet: 192.168.10.0/24  # Custom subnet
          gateway: 192.168.10.1
  # 2. PRIVATE: Kali ↔ Nginx
  kali-nginx-network:
    name: sticks-kali-nginx-network
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.20.0/24  # Custom subnet
          gateway: 192.168.20.1    # Network gateway

  # 3. PRIVATE: Nginx ↔ DB
  nginx-db-network:
    name: sticks-nginx-db-network
    driver: bridge
    internal: true  # No external access
    ipam:
      config:
        - subnet: 192.168.30.0/24  # Custom subnet
          gateway: 192.168.30.1    # Network gateway


# VOLUMES
# Each named volume is prefixed with the container that owns it, so it is
# obvious at a glance which service a volume belongs to in `docker volume ls`.
volumes:
  # PostgreSQL data for the application-layer `sticks-postgres` service.
  # Explicit `name:` pins the volume name so it is not prefixed twice by the
  # project name (would otherwise become `sticks_sticks-postgres-data`).
  sticks-postgres-data:
    name: sticks-postgres-data
  # MariaDB data for the lab target `sticks-mariadb-target` service
  # (was a bind-mount before).
  sticks-mariadb-target-data:
    name: sticks-mariadb-target-data
  # node_modules for the frontend Vite dev server. Keeps the container's
  # installed dependencies from being shadowed by the host source bind-mount.
  sticks-frontend-node-modules:
    name: sticks-frontend-node-modules
  # STIX bundle cache for the containerized `sticks-backend` service. A named
  # volume persists the ~50 MB bundle across container recreations and is reused
  # (no re-download), decoupling the runtime artifact from the repo tree.
  sticks-stix-cache:
    name: sticks-stix-cache
