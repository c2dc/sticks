# ============================================================
# STATIC NETWORK CONFIGURATION  (CONTAINED-BY-DEFAULT)
# ============================================================
# The attack/target lab (caldera, kali, nginx, db) lives ONLY on
# `internal: true` networks. Those networks have no gateway to the host
# or the internet, so the adversary emulation cannot reach the host or
# escape to the outside world on ANY machine (including a work laptop).
# `internal: true` affects RUNTIME only — `docker build` still uses
# Docker's default build network, so the Dockerfiles build normally.
#
# ONLY published host port: caldera 8888 (Caldera UI + API at localhost:8888).
# db / nginx / kali publish NO host ports. No external DNS on lab services.
#
# Caldera ALSO joins `caldera-mgmt-network` (a bridge, NOT internal). Docker
# only publishes host ports when a container is on at least one non-internal
# network, so this management bridge is what actually exposes 8888 to the host.
# It carries only Caldera's control channel; kali/nginx/db remain internal-only
# with no host or internet access.
#
# NETWORK                SUBNET            HOST        IP           (internal)
# ------------------------------------------------------------
# caldera-kali-network   172.20.0.0/24     caldera    172.20.0.10   yes
# caldera-kali-network   172.20.0.0/24     kali       172.20.0.20   yes
# caldera-mgmt-network   172.23.0.0/24     caldera    (dynamic)     no
#
# kali-nginx-network     172.21.0.0/24     kali       172.21.0.10   yes
# kali-nginx-network     172.21.0.0/24     nginx      172.21.0.20   yes
#
# nginx-db-network       172.22.0.0/24     nginx      172.22.0.10   yes
# nginx-db-network       172.22.0.0/24     db         172.22.0.20   yes
#
# APPLICATION LAYER (Pipeline_UI): frontend/backend/banco on `app-network`
# (bridge) ONLY — unchanged, separate from the attack lab.
# ============================================================

services:
  # DATABASE - Only accessible by Nginx
  db:
    build: .docker/db
    container_name: db
    hostname: db
    #restart: always
    tty: true
    volumes:
      - ./.docker/db/dbdata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    networks:
      nginx-db-network:
        ipv4_address: 172.22.0.20  # Fixed IP inside 172.22.0.0/24 (internal-only)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NGINX - The gateway/mediator
  nginx:
    build: .docker/nginx
    container_name: nginx
    hostname: nginx
    volumes:
      - ./.docker/nginx/var/www/html:/var/www/html
    networks:
      nginx-db-network:
        ipv4_address: 172.22.0.10  # Fixed IP for DB communication
      kali-nginx-network:
        ipv4_address: 172.21.0.20  # Fixed IP for Kali ↔ Nginx communication
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # CALDERA - Red Team Platform
  caldera:
    build: .docker/caldera
    container_name: caldera
    # NOTE: no --build — the magma UI is already compiled into the image (ui-build stage). Running the UI build at runtime fails (ENOTEMPTY) due to the source bind-mount.
    entrypoint:
      - python3
      - server.py
      - --insecure
    ports:
      - "8888:8888"
    volumes:
      - ./.docker/caldera:/usr/src/app
    environment:
      - TZ=America/New_York
      - CALDERA_SSL=false
    networks:
      caldera-kali-network:
        ipv4_address: 172.20.0.10  # Fixed IP inside Caldera-Kali network (attack plane)
      caldera-mgmt-network: {}     # Management plane: lets 8888 publish to the host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'KEY: ADMIN123' http://localhost:8888/api/v2/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m

  # KALI LINUX - Penetration Testing
  kali:
    build:
      context: .docker/kali
      dockerfile: Dockerfile
    container_name: kali
    hostname: kali-attacker
    volumes:
      - ./kali-data:/root
    networks:
      caldera-kali-network:
        ipv4_address: 172.20.0.20  # Fixed IP for communication with Caldera (internal-only)
      kali-nginx-network:
        ipv4_address: 172.21.0.10  # Fixed IP for communication with Nginx (internal-only)
    # Minimal capabilities for contained emulation: NET_RAW lets nmap/ping use
    # raw sockets. NET_ADMIN/SYS_ADMIN and privileged mode removed — not needed
    # for scanning the target inside the internal networks, and dropping them
    # shrinks the blast radius if the attacker container is compromised.
    cap_add:
      - NET_RAW
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ============================================================
  # APPLICATION LAYER (Pipeline_UI) — NOT part of the attack lab
  # ------------------------------------------------------------
  # frontend, backend and banco live on the application-layer bridge
  # network `app-network` ONLY. They MUST NOT join the internal attack
  # networks (caldera-kali-network / kali-nginx-network / nginx-db-network,
  # all `internal: true`). The backend reaches Caldera exclusively via the
  # host (localhost:8888 -> host.docker.internal:8888) and reads the Docker
  # Engine API (socket, read-only) purely to inspect container isolation.
  # ============================================================

  # BANCO - Application database (PostgreSQL) for the Pipeline_UI
  # Production/portability target. Local dev can still use SQLite.
  banco:
    image: postgres:16-alpine
    container_name: banco
    hostname: banco
    environment:
      POSTGRES_DB: pipeline_ui
      POSTGRES_USER: pipeline_ui
      POSTGRES_PASSWORD: pipeline_ui
    volumes:
      - banco-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline_ui -d pipeline_ui"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # BACKEND - FastAPI service that orchestrates the pipeline and applies
  # containment checks. Talks to Caldera ONLY via localhost:8888 and reads the
  # Docker socket read-only for isolation inspection.
  backend:
    build:
      context: ../pipeline_ui/backend
      dockerfile: Dockerfile
    container_name: pipeline-ui-backend
    hostname: pipeline-ui-backend
    working_dir: /repo/pipeline_ui/backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    environment:
      # Point the backend at the `banco` PostgreSQL service when run via compose.
      PIPELINE_UI_DATABASE_URL: postgresql+psycopg://pipeline_ui:pipeline_ui@banco:5432/pipeline_ui
      PIPELINE_UI_ENVIRONMENT: development
    ports:
      - "8010:8000"  # host 8010 -> container 8000 (8000 is taken by nginx)
    volumes:
      # Mount the repo root read-only so app/core/sticks_config.py can resolve
      # <repo>/sticks/config/config.py via parents[4] at runtime.
      - ..:/repo:ro
      # Docker Engine API, READ-ONLY, for isolation inspection only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      # Let `localhost:8888` semantics resolve to the host running Caldera's
      # published port. The backend uses host.docker.internal:8888.
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    depends_on:
      banco:
        condition: service_healthy
    restart: unless-stopped

  # FRONTEND - React + TypeScript SPA (Vite). Application layer only.
  frontend:
    build:
      context: ../pipeline_ui/frontend
      dockerfile: Dockerfile
    container_name: pipeline-ui-frontend
    hostname: pipeline-ui-frontend
    environment:
      # Browser reaches the backend via the host-published port (8010).
      VITE_API_BASE_URL: http://localhost:8010/api
      VITE_WS_BASE_URL: ws://localhost:8010
    ports:
      - "15173:4173"  # host 15173 -> container 4173 (avoids other local projects)
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped


# NETWORK CONFIGURATION
# hierarquical configuration: localhost -> caldera -> kali -> nginx -> db

networks:
  # APPLICATION LAYER: frontend <-> backend <-> banco ONLY.
  # NOT internal, and separate from the three attack networks. The application
  # services never join caldera-kali/kali-nginx/nginx-db networks.
  app-network:
    driver: bridge

  # C2 MANAGEMENT PLANE: publishes Caldera's UI/API (8888) to the host.
  # This is NOT internal, so the host (browser + backend on Windows) can reach
  # Caldera. It carries ONLY the Caldera control channel — the attacker (kali)
  # and targets (nginx, db) stay on their internal-only networks with no host
  # or internet access. Only Caldera joins this bridge.
  caldera-mgmt-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24
          gateway: 172.23.0.1

  # 1. PRIVATE: Caldera ↔ Kali ONLY
  caldera-kali-network:
    driver: bridge
    internal: true  # No external access
    ipam:
      config:
        - subnet: 172.20.0.0/24  # Custom subnet
          gateway: 172.20.0.1
  # 2. PRIVATE: Kali ↔ Nginx
  kali-nginx-network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24  # Custom subnet
          gateway: 172.21.0.1    # Network gateway

  # 3. PRIVATE: Nginx ↔ DB
  nginx-db-network:
    driver: bridge
    internal: true  # No external access
    ipam:
      config:
        - subnet: 172.22.0.0/24  # Custom subnet
          gateway: 172.22.0.1    # Network gateway


# VOLUMES
# Named volume for the application-layer PostgreSQL (banco) service.
volumes:
  banco-data:
