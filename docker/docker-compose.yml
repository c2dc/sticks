# ============================================================
# STATIC NETWORK CONFIGURATION
# ============================================================
# NETWORK                SUBNET            HOST        IP
# ------------------------------------------------------------
# caldera-kali-network   172.20.0.0/24     caldera    172.20.0.10
# caldera-kali-network   172.20.0.0/24     kali       172.20.0.20
#
# kali-nginx-network     172.21.0.0/24     kali       172.21.0.10
# kali-nginx-network     172.21.0.0/24     nginx      172.21.0.20
#
# nginx-db-network       172.22.0.0/24     nginx      172.22.0.10
# nginx-db-network       172.22.0.0/24     db         172.22.0.20
# ============================================================

services:
  # DATABASE - Only accessible by Nginx
  db:
    build: .docker/db
    container_name: db
    hostname: db
    #restart: always
    tty: true
    ports:
      - "33006:3306"  # External access for debugging ONLY - remove this line for production
    volumes:
      - ./.docker/db/dbdata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    networks:
      nginx-db-network:
        ipv4_address: 172.22.0.20  # Fixed IP inside 172.22.0.0/24
      local-network: {}  # Default bridge network (no fixed IP asigned)
    dns:
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NGINX - The gateway/mediator
  nginx:
    build: .docker/nginx
    container_name: nginx
    hostname: nginx
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./.docker/nginx/var/www/html:/var/www/html
    networks:
      nginx-db-network:
        ipv4_address: 172.22.0.10  # Fixed IP for DB communication
      kali-nginx-network:
        ipv4_address: 172.21.0.20  # Fixed IP for Kali ↔ Nginx communication
      local-network: {}  # Default bridge network (no fixed IP asigned)
    dns:
      - 8.8.8.8
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # CALDERA - Red Team Platform
  caldera:
    build: .docker/caldera
    container_name: caldera
    entrypoint:
      - python3
      - server.py
      - --build
      - --insecure
      - --fresh
    ports:
      - "8888:8888"
    volumes:
      - ./.docker/caldera:/usr/src/app
    environment:
      - TZ=America/New_York
      - CALDERA_SSL=false
    networks:
      caldera-kali-network:
        ipv4_address: 172.20.0.10  # Fixed IP inside Caldera-Kali network
      local-network: {}  # Default bridge network (no fixed IP asigned)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 10s
      retries: 3

  # KALI LINUX - Penetration Testing
  kali:
    build:
      context: .docker/kali
      dockerfile: Dockerfile
    container_name: kali
    hostname: kali-attacker
    volumes:
      - ./kali-data:/root
    networks:
      caldera-kali-network:
        ipv4_address: 172.20.0.20  # Fixed IP for communication with Caldera
      kali-nginx-network:
        ipv4_address: 172.21.0.10  # Fixed IP for communication with Nginx
      local-network: {}  # Default bridge network (no fixed IP asigned)
    dns:
      - 8.8.8.8
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ============================================================
  # APPLICATION LAYER (Pipeline_UI) — NOT part of the attack lab
  # ------------------------------------------------------------
  # frontend, backend and banco live on the application-layer bridge
  # network `app-network` ONLY. They MUST NOT join the internal attack
  # networks (caldera-kali-network / kali-nginx-network / nginx-db-network,
  # all `internal: true`). The backend reaches Caldera exclusively via the
  # host (localhost:8888 -> host.docker.internal:8888) and reads the Docker
  # Engine API (socket, read-only) purely to inspect container isolation.
  # ============================================================

  # BANCO - Application database (PostgreSQL) for the Pipeline_UI
  # Production/portability target. Local dev can still use SQLite.
  banco:
    image: postgres:16-alpine
    container_name: banco
    hostname: banco
    environment:
      POSTGRES_DB: pipeline_ui
      POSTGRES_USER: pipeline_ui
      POSTGRES_PASSWORD: pipeline_ui
    volumes:
      - banco-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline_ui -d pipeline_ui"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # BACKEND - FastAPI service that orchestrates the pipeline and applies
  # containment checks. Talks to Caldera ONLY via localhost:8888 and reads the
  # Docker socket read-only for isolation inspection.
  backend:
    build:
      context: ../pipeline_ui/backend
      dockerfile: Dockerfile
    container_name: pipeline-ui-backend
    hostname: pipeline-ui-backend
    working_dir: /repo/pipeline_ui/backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    environment:
      # Point the backend at the `banco` PostgreSQL service when run via compose.
      PIPELINE_UI_DATABASE_URL: postgresql+psycopg://pipeline_ui:pipeline_ui@banco:5432/pipeline_ui
      PIPELINE_UI_ENVIRONMENT: development
    ports:
      - "8010:8000"  # host 8010 -> container 8000 (8000 is taken by nginx)
    volumes:
      # Mount the repo root read-only so app/core/sticks_config.py can resolve
      # <repo>/sticks/config/config.py via parents[4] at runtime.
      - ..:/repo:ro
      # Docker Engine API, READ-ONLY, for isolation inspection only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      # Let `localhost:8888` semantics resolve to the host running Caldera's
      # published port. The backend uses host.docker.internal:8888.
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    depends_on:
      banco:
        condition: service_healthy
    restart: unless-stopped

  # FRONTEND - React + TypeScript SPA (Vite). Application layer only.
  frontend:
    build:
      context: ../pipeline_ui/frontend
      dockerfile: Dockerfile
    container_name: pipeline-ui-frontend
    hostname: pipeline-ui-frontend
    environment:
      # Browser reaches the backend via the host-published port (8010).
      VITE_API_BASE_URL: http://localhost:8010/api
      VITE_WS_BASE_URL: ws://localhost:8010
    ports:
      - "5173:4173"  # host 5173 -> container 4173 (vite preview)
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped


# NETWORK CONFIGURATION
# hierarquical configuration: localhost -> caldera -> kali -> nginx -> db

networks:
  # 0. Local Network
  local-network:
    driver: bridge  # Default Docker bridge (external reachable if ports exposed)

  # APPLICATION LAYER: frontend <-> backend <-> banco ONLY.
  # NOT internal, and separate from the three attack networks. The application
  # services never join caldera-kali/kali-nginx/nginx-db networks.
  app-network:
    driver: bridge

  # 1. PRIVATE: Caldera ↔ Kali ONLY
  caldera-kali-network:
    driver: bridge
    internal: true  # No external access
    ipam:
      config:
        - subnet: 172.20.0.0/24  # Custom subnet
          gateway: 172.20.0.1
  # 2. PRIVATE: Kali ↔ Nginx
  kali-nginx-network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24  # Custom subnet
          gateway: 172.21.0.1    # Network gateway

  # 3. PRIVATE: Nginx ↔ DB
  nginx-db-network:
    driver: bridge
    internal: true  # No external access
    ipam:
      config:
        - subnet: 172.22.0.0/24  # Custom subnet
          gateway: 172.22.0.1    # Network gateway


# VOLUMES
# Named volume for the application-layer PostgreSQL (banco) service.
volumes:
  banco-data:
