[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-ui-backend"
version = "0.1.0"
description = "Backend FastAPI da Pipeline_UI para o projeto sticks (ATT&CK-in-STIX / APT emulation)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sticks project" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.1",
    "httpx>=0.27",
    "docker>=7.1",
    "langchain-openai>=0.1",
    "pgvector>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff==0.17.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.seeds" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
# Generated/cache directories; the virtualenv is already excluded by Ruff's defaults.
extend-exclude = [".hypothesis", ".pytest_cache", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes: unused imports/variables, undefined names
    "W",    # pycodestyle warnings
    "I",    # isort: import ordering (safe autofix)
    "B",    # flake8-bugbear: likely bugs (mutable defaults, misused except)
    "UP",   # pyupgrade for Python 3.11 (safe autofix)
    "C4",   # flake8-comprehensions: behavior-preserving simplifications
    "SIM",  # flake8-simplify: behavior-preserving simplifications
    "BLE",  # blind `except Exception`; legitimate cases become justified suppressions
    "S",    # bandit: basic security checks (urlopen, SQL strings, subprocess)
    "PGH",  # pygrep-hooks: require a rule code on `noqa` / `type: ignore`
    "RUF",  # Ruff-specific rules, including RUF100 (unused noqa)
]
# The formatter controls line width; long string literals stay as they are.
ignore = [
    "E501",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and form/file parameters as default values; these calls
# build immutable marker objects, so B008 is a false positive for them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# assert, fake secrets, fake temp paths in fixture data and fixed-argv subprocess runs are normal in tests.
"tests/**" = ["S101", "S105", "S106", "S108", "S603"]
# Historical migrations are immutable.
"alembic/versions/**" = ["UP", "RUF012"]
