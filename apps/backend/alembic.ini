# Alembic configuration for the Pipeline_UI backend.
#
# The database URL is intentionally NOT hard-coded here. It is resolved at
# runtime from the application settings (env var PIPELINE_UI_DATABASE_URL,
# defaulting to local SQLite) inside alembic/env.py, so PostgreSQL vs SQLite is
# chosen by environment alone — no code or config edits needed.

[alembic]
# Path to migration scripts, relative to this file's directory.
script_location = alembic

# Template used to generate migration file names; prefixes revisions with a
# UTC timestamp so history sorts chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Use OS-independent path separators inside version_locations.
prepend_sys_path = .

# Timezone for file_template timestamps.
timezone = UTC

# sqlalchemy.url is left blank on purpose; env.py injects it from Settings.
sqlalchemy.url =


[post_write_hooks]
# No post-write hooks configured.


# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
