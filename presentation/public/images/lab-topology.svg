<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <marker id="aR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8b2fd6"/>
    </marker>
  </defs>
  <rect width="760" height="352" fill="#ffffff"/>

  <!-- containment boundary -->
  <rect x="16" y="16" width="728" height="320" rx="16" fill="#fbfcff" stroke="#8b2fd6" stroke-dasharray="6 5" stroke-width="2"/>
  <text x="34" y="42" font-size="13" font-weight="800" fill="#8b2fd6">Isolated Docker lab, internal:true networks, NO route to host or internet</text>

  <!-- edges first (so node boxes and labels draw on top) -->
  <g stroke="#8b2fd6" stroke-width="2.5" fill="none">
    <line x1="210" y1="125" x2="296" y2="125" marker-end="url(#aR)"/>
    <line x1="375" y1="162" x2="375" y2="246" marker-end="url(#aR)"/>
    <line x1="450" y1="285" x2="536" y2="285" marker-end="url(#aR)"/>
  </g>

  <!-- network labels (white pill background so they never look blurred/overlapped) -->
  <g font-size="11" font-weight="700" fill="#6b46c1">
    <g transform="translate(253,125)">
      <rect x="-48" y="-11" width="96" height="22" rx="6" fill="#ffffff" stroke="#e9d9fb"/>
      <text x="0" y="4" text-anchor="middle">caldera-kali</text>
    </g>
    <g transform="translate(375,204)">
      <rect x="-46" y="-11" width="92" height="22" rx="6" fill="#ffffff" stroke="#e9d9fb"/>
      <text x="0" y="4" text-anchor="middle">kali-nginx</text>
    </g>
    <g transform="translate(493,285)">
      <rect x="-42" y="-11" width="84" height="22" rx="6" fill="#ffffff" stroke="#e9d9fb"/>
      <text x="0" y="4" text-anchor="middle">nginx-db</text>
    </g>
  </g>

  <!-- nodes: attackers = RED (caldera, kali); targets = BLUE (nginx, db) -->
  <g>
    <!-- caldera C2 (attacker) -->
    <g transform="translate(60,90)">
      <rect width="150" height="70" rx="12" fill="#fde9e8" stroke="#e1322f" stroke-width="1.5"/>
      <text x="75" y="28" text-anchor="middle" font-size="13" font-weight="800" fill="#e1322f">caldera (C2)</text>
      <text x="75" y="48" text-anchor="middle" font-size="10" fill="#334155">adversary emulation</text>
      <text x="75" y="62" text-anchor="middle" font-size="9" fill="#64748b">192.168.10.10</text>
    </g>
    <!-- kali attacker (attacker) -->
    <g transform="translate(300,90)">
      <rect width="150" height="70" rx="12" fill="#fde9e8" stroke="#e1322f" stroke-width="1.5"/>
      <text x="75" y="28" text-anchor="middle" font-size="13" font-weight="800" fill="#e1322f">kali (attacker)</text>
      <text x="75" y="48" text-anchor="middle" font-size="10" fill="#334155">runs agent + cmds</text>
      <text x="75" y="62" text-anchor="middle" font-size="9" fill="#64748b">.20 on every net</text>
    </g>
    <!-- nginx target (service under attack) -->
    <g transform="translate(300,250)">
      <rect width="150" height="70" rx="12" fill="#eaf2fe" stroke="#1d6fe0" stroke-width="1.5"/>
      <text x="75" y="28" text-anchor="middle" font-size="13" font-weight="800" fill="#1d6fe0">nginx (web)</text>
      <text x="75" y="48" text-anchor="middle" font-size="10" fill="#334155">web target</text>
      <text x="75" y="62" text-anchor="middle" font-size="9" fill="#64748b">192.168.20.30</text>
    </g>
    <!-- db target (service under attack) -->
    <g transform="translate(540,250)">
      <rect width="150" height="70" rx="12" fill="#eaf2fe" stroke="#1d6fe0" stroke-width="1.5"/>
      <text x="75" y="28" text-anchor="middle" font-size="13" font-weight="800" fill="#1d6fe0">db (backend)</text>
      <text x="75" y="48" text-anchor="middle" font-size="10" fill="#334155">data target</text>
      <text x="75" y="62" text-anchor="middle" font-size="9" fill="#64748b">192.168.30.40</text>
    </g>
  </g>
</svg>