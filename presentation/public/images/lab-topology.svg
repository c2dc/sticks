<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8b2fd6"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>

  <!-- containment boundary -->
  <rect x="16" y="16" width="728" height="388" rx="16" fill="#fbfcff" stroke="#8b2fd6" stroke-dasharray="6 5" stroke-width="2"/>
  <text x="34" y="42" font-size="13" font-weight="800" fill="#8b2fd6">Isolated Docker lab — internal:true networks, NO route to host or internet</text>

  <!-- nodes -->
  <g>
    <!-- caldera C2 -->
    <g transform="translate(60,90)">
      <rect width="150" height="70" rx="12" fill="#eaf2fe" stroke="#1d6fe0"/>
      <text x="75" y="28" text-anchor="middle" font-size="13" font-weight="800" fill="#1d6fe0">caldera (C2)</text>
      <text x="75" y="48" text-anchor="middle" font-size="10" fill="#334155">adversary emulation</text>
      <text x="75" y="62" text-anchor="middle" font-size="9" fill="#64748b">192.168.10.10</text>
    </g>
    <!-- kali attacker -->
    <g transform="translate(300,90)">
      <rect width="150" height="70" rx="12" fill="#f3eafe" stroke="#8b2fd6"/>
      <text x="75" y="28" text-anchor="middle" font-size="13" font-weight="800" fill="#8b2fd6">kali (attacker)</text>
      <text x="75" y="48" text-anchor="middle" font-size="10" fill="#334155">runs agent + cmds</text>
      <text x="75" y="62" text-anchor="middle" font-size="9" fill="#64748b">.20 on every net</text>
    </g>
    <!-- nginx target -->
    <g transform="translate(300,250)">
      <rect width="150" height="70" rx="12" fill="#fde9e8" stroke="#e1322f"/>
      <text x="75" y="28" text-anchor="middle" font-size="13" font-weight="800" fill="#e1322f">nginx (web)</text>
      <text x="75" y="48" text-anchor="middle" font-size="10" fill="#334155">web target</text>
      <text x="75" y="62" text-anchor="middle" font-size="9" fill="#64748b">192.168.20.30</text>
    </g>
    <!-- db target -->
    <g transform="translate(540,250)">
      <rect width="150" height="70" rx="12" fill="#fde9e8" stroke="#e1322f"/>
      <text x="75" y="28" text-anchor="middle" font-size="13" font-weight="800" fill="#e1322f">db (backend)</text>
      <text x="75" y="48" text-anchor="middle" font-size="10" fill="#334155">data target</text>
      <text x="75" y="62" text-anchor="middle" font-size="9" fill="#64748b">192.168.30.40</text>
    </g>
  </g>

  <!-- edges -->
  <g stroke="#8b2fd6" stroke-width="2" fill="none">
    <line x1="210" y1="125" x2="298" y2="125" marker-end="url(#a2)"/>
    <text x="214" y="116" font-size="8.5" fill="#64748b">caldera-kali net</text>
    <line x1="375" y1="160" x2="375" y2="248" marker-end="url(#a2)"/>
    <text x="382" y="208" font-size="8.5" fill="#64748b">kali-nginx</text>
    <line x1="450" y1="285" x2="538" y2="285" marker-end="url(#a2)"/>
    <text x="456" y="276" font-size="8.5" fill="#64748b">nginx-db net</text>
  </g>

  <!-- guards -->
  <g transform="translate(60,348)">
    <rect width="630" height="40" rx="10" fill="#f6f8fc" stroke="#e2e8f0"/>
    <text x="14" y="18" font-size="10.5" font-weight="800" fill="#0f1726">Containment guards:</text>
    <text x="14" y="33" font-size="9.5" fill="#334155">external target → blocks the whole run · non-isolated container → aborts · explicit confirm before exec · 1:1 audit per command</text>
  </g>
</svg>
