<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d6fe0"/><stop offset="0.52" stop-color="#8b2fd6"/><stop offset="1" stop-color="#e1322f"/>
    </linearGradient>
    <marker id="aa" markerWidth="11" markerHeight="11" refX="7" refY="3.3" orient="auto">
      <path d="M0,0 L8,3.3 L0,6.6 Z" fill="#64748b"/>
    </marker>
    <marker id="ab" markerWidth="11" markerHeight="11" refX="7" refY="3.3" orient="auto">
      <path d="M0,0 L8,3.3 L0,6.6 Z" fill="#8b2fd6"/>
    </marker>
    <marker id="ac" markerWidth="11" markerHeight="11" refX="7" refY="3.3" orient="auto">
      <path d="M0,0 L8,3.3 L0,6.6 Z" fill="#1d6fe0"/>
    </marker>
    <marker id="ad" markerWidth="11" markerHeight="11" refX="7" refY="3.3" orient="auto">
      <path d="M0,0 L8,3.3 L0,6.6 Z" fill="#e1322f"/>
    </marker>
  </defs>
  <rect width="1180" height="760" fill="#ffffff"/>

  <!-- ===================== INPUTS (top band) ===================== -->
  <text x="40" y="36" font-size="18" font-weight="800" fill="#1d6fe0">INPUTS</text>
  <g>
    <rect x="40" y="50" width="258" height="56" rx="10" fill="#eaf2fe" stroke="#1d6fe0"/>
    <text x="169" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1726">STIX / ATT&amp;CK CTI</text>

    <rect x="312" y="50" width="258" height="56" rx="10" fill="#eaf2fe" stroke="#1d6fe0"/>
    <text x="441" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1726">Atomic Red Team</text>

    <rect x="610" y="50" width="258" height="56" rx="10" fill="#eaf2fe" stroke="#1d6fe0"/>
    <text x="739" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1726">Lab catalog / compose</text>

    <rect x="882" y="50" width="258" height="56" rx="10" fill="#eaf2fe" stroke="#1d6fe0"/>
    <text x="1011" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#0f1726">8 human-curated cases</text>
  </g>

  <!-- ===================== KNOWLEDGE / MEMORY (left column) ===================== -->
  <g>
    <rect x="40" y="150" width="300" height="430" rx="16" fill="#f3f8ff" stroke="#1d6fe0" stroke-width="1.5"/>
    <text x="190" y="184" text-anchor="middle" font-size="17" font-weight="800" fill="#1d6fe0">KNOWLEDGE &amp; MEMORY</text>

    <rect x="60" y="202" width="260" height="112" rx="10" fill="#eaf2fe" stroke="#1d6fe0"/>
    <text x="190" y="248" text-anchor="middle" font-size="17" font-weight="800" fill="#1d6fe0">RAG · retrieval</text>
    <rect x="76" y="268" width="228" height="34" rx="7" fill="#ffffff" stroke="#1d6fe0"/>
    <text x="190" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1726">Vector store</text>

    <rect x="60" y="330" width="260" height="100" rx="10" fill="#eef9f1" stroke="#17a34a"/>
    <text x="190" y="368" text-anchor="middle" font-size="17" font-weight="800" fill="#17a34a">Agent memory</text>
    <text x="190" y="396" text-anchor="middle" font-size="14" fill="#334155">working + long-term</text>

    <rect x="60" y="446" width="260" height="112" rx="10" fill="#f6f8fc" stroke="#94a3b8"/>
    <text x="190" y="486" text-anchor="middle" font-size="17" font-weight="800" fill="#0f1726">Databases</text>
    <text x="190" y="514" text-anchor="middle" font-size="14" fill="#334155">relational · vector</text>
    <text x="190" y="534" text-anchor="middle" font-size="14" fill="#334155">· artifact store</text>
  </g>

  <!-- ===================== AGENT CORE (center) ===================== -->
  <g>
    <rect x="360" y="150" width="500" height="430" rx="16" fill="#faf6ff" stroke="#8b2fd6" stroke-width="2"/>

    <!-- Orchestrator + LLM -->
    <rect x="380" y="172" width="460" height="60" rx="10" fill="#ffffff" stroke="#8b2fd6" stroke-width="1.5"/>
    <text x="520" y="208" text-anchor="middle" font-size="17" font-weight="800" fill="#8b2fd6">Orchestrator / planner</text>
    <rect x="700" y="182" width="128" height="40" rx="9" fill="#f3eafe" stroke="#8b2fd6"/>
    <text x="764" y="208" text-anchor="middle" font-size="16" font-weight="800" fill="#8b2fd6">LLM</text>

    <!-- per-stage sub-agents -->
    <rect x="380" y="250" width="222" height="72" rx="10" fill="#f3eafe" stroke="#6b43d6"/>
    <text x="491" y="284" text-anchor="middle" font-size="16" font-weight="800" fill="#6b43d6">DAG agent</text>
    <text x="491" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#6b43d6">Stage 3</text>

    <rect x="618" y="250" width="222" height="72" rx="10" fill="#f3eafe" stroke="#8b2fd6"/>
    <text x="729" y="284" text-anchor="middle" font-size="16" font-weight="800" fill="#8b2fd6">Operationalize</text>
    <text x="729" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2fd6">Stage 4</text>

    <rect x="380" y="334" width="222" height="72" rx="10" fill="#f6ebf3" stroke="#b52e9e"/>
    <text x="491" y="368" text-anchor="middle" font-size="16" font-weight="800" fill="#b52e9e">Env. agent</text>
    <text x="491" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#b52e9e">Stage 5</text>

    <rect x="618" y="334" width="222" height="72" rx="10" fill="#fdeeec" stroke="#e1322f"/>
    <text x="729" y="368" text-anchor="middle" font-size="16" font-weight="800" fill="#e1322f">Measure loop</text>
    <text x="729" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#e1322f">Stage 6</text>

    <!-- shared tools -->
    <rect x="380" y="418" width="460" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="610" y="451" text-anchor="middle" font-size="16" font-weight="800" fill="#0f1726">Deterministic tools</text>

    <!-- guardrails -->
    <rect x="380" y="484" width="460" height="74" rx="10" fill="#fff7f6" stroke="#e1322f"/>
    <text x="610" y="518" text-anchor="middle" font-size="16" font-weight="800" fill="#e1322f">Safety guardrails</text>
    <text x="610" y="540" text-anchor="middle" font-size="13" fill="#334155">containment · isolation · preview · audit</text>
  </g>

  <!-- ===================== OUTPUTS (right column) ===================== -->
  <g>
    <rect x="880" y="150" width="260" height="430" rx="16" fill="#faf6ff" stroke="#8b2fd6" stroke-width="1.5"/>
    <text x="1010" y="184" text-anchor="middle" font-size="17" font-weight="800" fill="#8b2fd6">OUTPUTS</text>

    <rect x="900" y="202" width="220" height="68" rx="10" fill="#f3eafe" stroke="#6b43d6"/>
    <text x="1010" y="233" text-anchor="middle" font-size="16" font-weight="800" fill="#6b43d6">Campaign DAG</text>
    <text x="1010" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#6b43d6">Stage 3</text>

    <rect x="900" y="286" width="220" height="68" rx="10" fill="#f3eafe" stroke="#8b2fd6"/>
    <text x="1010" y="317" text-anchor="middle" font-size="16" font-weight="800" fill="#8b2fd6">Commands</text>
    <text x="1010" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2fd6">Stage 4</text>

    <rect x="900" y="370" width="220" height="68" rx="10" fill="#f6ebf3" stroke="#b52e9e"/>
    <text x="1010" y="401" text-anchor="middle" font-size="16" font-weight="800" fill="#b52e9e">Target environment</text>
    <text x="1010" y="422" text-anchor="middle" font-size="13" font-weight="700" fill="#b52e9e">Stage 5</text>

    <rect x="900" y="454" width="220" height="68" rx="10" fill="#fdeeec" stroke="#e1322f"/>
    <text x="1010" y="485" text-anchor="middle" font-size="16" font-weight="800" fill="#e1322f">Execution report</text>
    <text x="1010" y="506" text-anchor="middle" font-size="13" font-weight="700" fill="#e1322f">Stage 6</text>

    <text x="1010" y="552" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2fd6">origin = ai_generated</text>
  </g>

  <!-- ===================== ARROWS ===================== -->
  <!-- inputs top band -> agent (down the middle) -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="610" y1="106" x2="610" y2="148" marker-end="url(#aa)"/>
  </g>
  <!-- knowledge/memory <-> agent (bidirectional retrieve/store) -->
  <g stroke="#1d6fe0" stroke-width="2" fill="none">
    <line x1="340" y1="345" x2="358" y2="345" marker-end="url(#ac)"/>
    <line x1="358" y1="395" x2="340" y2="395" marker-end="url(#ac)"/>
  </g>
  <text x="312" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#1d6fe0">retrieve</text>
  <text x="314" y="418" text-anchor="middle" font-size="13" font-weight="700" fill="#17a34a">store</text>
  <!-- agent -> outputs -->
  <g stroke="#8b2fd6" stroke-width="2" fill="none">
    <line x1="862" y1="365" x2="878" y2="365" marker-end="url(#ab)"/>
  </g>
  <!-- feedback loop: report -> measure loop -->
  <g stroke="#e1322f" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <path d="M900,488 C960,560 760,620 729,410" marker-end="url(#ad)"/>
  </g>
  <text x="820" y="612" font-size="14" font-weight="700" fill="#e1322f">feedback loop (Stage 6 verdict)</text>
</svg>
