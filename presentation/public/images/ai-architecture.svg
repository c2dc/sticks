<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 580" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d6fe0"/><stop offset="0.52" stop-color="#8b2fd6"/><stop offset="1" stop-color="#e1322f"/>
    </linearGradient>
    <marker id="aa" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="ap" markerWidth="11" markerHeight="11" refX="7" refY="3.3" orient="auto"><path d="M0,0 L8,3.3 L0,6.6 Z" fill="#8b2fd6"/></marker>
  </defs>
  <rect width="1360" height="580" fill="#ffffff"/>

  <!-- LEFT: tools + knowledge -->
  <g transform="translate(20,34)">
    <text x="0" y="0" font-size="12.5" font-weight="800" fill="#1d6fe0">TOOL LAYER (wrappers over existing services)</text>
    <g font-size="10.5">
      <rect x="0" y="12" width="250" height="40" rx="9" fill="#eaf2fe" stroke="#1d6fe0"/><text x="12" y="30" font-weight="700" fill="#0f1726">STIX / ATT&amp;CK reader</text><text x="12" y="45" fill="#64748b">StixService / CaseService</text>
      <rect x="0" y="60" width="250" height="40" rx="9" fill="#eaf2fe" stroke="#1d6fe0"/><text x="12" y="78" font-weight="700" fill="#0f1726">Atomic Red Team lookup</text><text x="12" y="93" fill="#64748b">command source (operationalization)</text>
      <rect x="0" y="108" width="250" height="40" rx="9" fill="#eaf2fe" stroke="#1d6fe0"/><text x="12" y="126" font-weight="700" fill="#0f1726">Command parser + containment</text><text x="12" y="141" fill="#64748b">services.containment</text>
      <rect x="0" y="156" width="250" height="40" rx="9" fill="#eaf2fe" stroke="#1d6fe0"/><text x="12" y="174" font-weight="700" fill="#0f1726">Docker/compose + Caldera</text><text x="12" y="189" fill="#64748b">ComposeExecutor / CalderaClient</text>
    </g>

    <text x="0" y="236" font-size="12.5" font-weight="800" fill="#e1322f">LLM PROVIDER</text>
    <rect x="0" y="248" width="250" height="56" rx="9" fill="#fdeeec" stroke="#e1322f"/>
    <text x="12" y="268" font-size="11" font-weight="800" fill="#e1322f">SEPINF (OpenAI-compatible)</text>
    <text x="12" y="284" font-size="9.5" fill="#334155">model: glm-5.3-flash</text>
    <text x="12" y="298" font-size="9.5" fill="#64748b">via LangChain ChatOpenAI (base_url+key)</text>

    <text x="0" y="338" font-size="12.5" font-weight="800" fill="#0f1726">MEMORY (PostgreSQL :9090)</text>
    <rect x="0" y="350" width="250" height="46" rx="9" fill="#f6f8fc" stroke="#cbd5e1"/>
    <text x="12" y="368" font-size="10.5" font-weight="700" fill="#0f1726">Relational = source of truth</text>
    <text x="12" y="384" font-size="9.5" fill="#64748b">+ LangGraph checkpointer (resume)</text>
    <rect x="0" y="404" width="250" height="46" rx="9" fill="#faf6ff" stroke="#8b2fd6"/>
    <text x="12" y="422" font-size="10.5" font-weight="700" fill="#8b2fd6">pgvector = experience memory</text>
    <text x="12" y="438" font-size="9.5" fill="#64748b">RAG retrieval across campaigns</text>
  </g>

  <!-- CENTER: LangGraph multi-agent -->
  <g transform="translate(300,24)">
    <rect width="740" height="532" rx="16" fill="#faf6ff" stroke="#8b2fd6" stroke-width="2"/>
    <rect width="740" height="40" rx="16" fill="url(#gg)"/>
    <text x="370" y="26" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">MULTI-AGENT SYSTEM — LangGraph StateGraph</text>

    <!-- orchestrator -->
    <rect x="26" y="56" width="688" height="44" rx="10" fill="#ffffff" stroke="#8b2fd6"/>
    <text x="40" y="76" font-size="12.5" font-weight="800" fill="#8b2fd6">Orchestrator</text>
    <text x="40" y="92" font-size="9.5" fill="#64748b">seeds state + RAG retrieval; drives nodes; one specialized agent per phase</text>

    <!-- agents row -->
    <g>
      <rect x="26" y="114" width="220" height="104" rx="10" fill="#f3eafe" stroke="#6b43d6"/>
      <text x="40" y="136" font-size="12" font-weight="800" fill="#6b43d6">Operationalization agent</text>
      <text x="40" y="155" font-size="9.5" fill="#334155">picks/parametrizes</text>
      <text x="40" y="169" font-size="9.5" fill="#334155">commands + env params</text>
      <text x="40" y="188" font-size="9" font-weight="700" fill="#6b43d6">first agent phase (core)</text>
      <text x="40" y="206" font-size="9" font-weight="700" fill="#6b43d6">origin = ai_generated</text>

      <rect x="260" y="114" width="220" height="104" rx="10" fill="#f3eafe" stroke="#8b2fd6"/>
      <text x="274" y="136" font-size="12" font-weight="800" fill="#8b2fd6">Flow agent</text>
      <text x="274" y="155" font-size="9.5" fill="#334155">builds the attack flow:</text>
      <text x="274" y="169" font-size="9.5" fill="#334155">exact | adapted | created</text>
      <text x="274" y="188" font-size="9" font-weight="700" fill="#8b2fd6">follows operationalization</text>
      <text x="274" y="206" font-size="9" font-weight="700" fill="#8b2fd6">origin = ai_generated</text>

      <rect x="494" y="114" width="220" height="104" rx="10" fill="#f6ebf3" stroke="#b52e9e"/>
      <text x="508" y="136" font-size="12" font-weight="800" fill="#b52e9e">Environment agent</text>
      <text x="508" y="155" font-size="9.5" fill="#334155">designs &amp; provisions</text>
      <text x="508" y="169" font-size="9.5" fill="#334155">the isolated lab</text>
      <text x="508" y="188" font-size="9" font-weight="700" fill="#b52e9e">implements Provisioner</text>
      <text x="508" y="206" font-size="9" font-weight="700" fill="#b52e9e">origin = ai_generated</text>
    </g>

    <!-- execute + evaluate -->
    <rect x="26" y="232" width="454" height="66" rx="10" fill="#fdeeec" stroke="#e1322f"/>
    <text x="40" y="254" font-size="12" font-weight="800" fill="#e1322f">Execution node (existing OperationRunner, UNCHANGED)</text>
    <text x="40" y="272" font-size="9.5" fill="#334155">containment → isolation (read-only, fail-closed) → preview/confirm →</text>
    <text x="40" y="287" font-size="9.5" fill="#334155">contained execution → 1:1 audit → run results</text>

    <rect x="494" y="232" width="220" height="66" rx="10" fill="#ffffff" stroke="#8b2fd6"/>
    <text x="508" y="254" font-size="12" font-weight="800" fill="#8b2fd6">Evaluation node</text>
    <text x="508" y="272" font-size="9.5" fill="#334155">measures sufficiency,</text>
    <text x="508" y="287" font-size="9.5" fill="#334155">reads failed nodes → refine / finish</text>

    <!-- flow arrows -->
    <g stroke="#64748b" stroke-width="2" fill="none">
      <line x1="136" y1="100" x2="136" y2="112" marker-end="url(#aa)"/>
      <line x1="246" y1="166" x2="258" y2="166" marker-end="url(#aa)"/>
      <line x1="480" y1="166" x2="492" y2="166" marker-end="url(#aa)"/>
      <line x1="370" y1="218" x2="300" y2="230" marker-end="url(#aa)"/>
      <line x1="480" y1="265" x2="492" y2="265" marker-end="url(#aa)"/>
    </g>

    <!-- improvement loop -->
    <path d="M604,298 C604,340 604,330 360,330 L150,330 C90,330 90,300 136,222" fill="none" stroke="#8b2fd6" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ap)"/>
    <g transform="translate(370,330)"><rect x="-150" y="-13" width="300" height="26" rx="8" fill="#ffffff" stroke="#e9d9fb"/><text x="0" y="4" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b46c1">improvement loop (guarded by max_iterations)</text></g>

    <!-- footer: seams + safety -->
    <rect x="26" y="358" width="688" height="44" rx="10" fill="#fff7f6" stroke="#e1322f"/>
    <text x="40" y="378" font-size="11" font-weight="800" fill="#e1322f">Safety is UNCHANGED, the agent PROPOSES, the gates DISPOSE.</text>
    <text x="40" y="394" font-size="9.5" fill="#334155">no gate bypass · agent never runs on the host · every command re-validated by containment</text>

    <rect x="26" y="412" width="688" height="98" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="40" y="432" font-size="11" font-weight="800" fill="#0f1726">Plugs into the existing phase pipeline via origin seams</text>
    <text x="40" y="452" font-size="9.5" fill="#334155">Operationalization → OperationalizerByOrigin · Flow → FlowGenerator · Environment → EnvironmentProvisioner</text>
    <text x="40" y="470" font-size="9.5" fill="#334155">AI artifacts persisted with origin = ai_generated (already accepted by the DB CHECK, no migration)</text>
    <text x="40" y="492" font-size="9.5" fill="#64748b">Learning: in-campaign via the loop + across-campaign via RAG. No model fine-tuning.</text>
  </g>

  <!-- connectors from left into center -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none" stroke-dasharray="4 3">
    <line x1="270" y1="120" x2="300" y2="150" marker-end="url(#aa)"/>
    <line x1="270" y1="290" x2="300" y2="250" marker-end="url(#aa)"/>
    <line x1="270" y1="400" x2="300" y2="430" marker-end="url(#aa)"/>
  </g>
</svg>