  <!-- reading guide -->
  <g transform="translate(20,250)">
    <rect width="1360" height="150" rx="12" fill="#f6f8fc" stroke="#e2e8f0"/>
    <text x="24" y="34" font-size="15" font-weight="800" fill="#0f1726">How to read the matrix</text>
    <rect x="24" y="44" width="56" height="4" rx="2" fill="#8b2fd6"/>
    <text x="24" y="74" font-size="12.5" fill="#334155"><tspan font-weight="700" fill="#1d6fe0">Columns = Tactics</tspan>  —  the adversary's goal / the "why" (e.g. gain Initial Access, achieve Impact).</text>
    <text x="24" y="100" font-size="12.5" fill="#334155"><tspan font-weight="700" fill="#8b2fd6">Cells = Techniques</tspan>  —  the "how": a method to achieve the tactic. Many expand into sub-techniques.</text>
    <text x="24" y="126" font-size="12.5" fill="#334155"><tspan font-weight="700" fill="#e1322f">A campaign = a path across the matrix</tspan>  —  an ordered chain of techniques an APT actually executed.</text>
  </g>

  <!-- key takeaway -->
  <g transform="translate(20,418)">
    <rect width="1360" height="184" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect width="6" height="184" rx="3" fill="url(#hdr)"/>
    <text x="28" y="40" font-size="15" font-weight="800" fill="#0f1726">What ATT&amp;CK gives us — and what it does NOT</text>
    <text x="28" y="74" font-size="12.5" fill="#334155">✓  A shared vocabulary of adversary behavior, curated from real-world intrusions and threat reports.</text>
    <text x="28" y="100" font-size="12.5" fill="#334155">✓  The "what": which techniques a known actor/campaign is associated with (the knowledge base behind STIX CTI).</text>
    <text x="28" y="132" font-size="12.5" fill="#b91c1c">✗  NOT the procedure: ATT&amp;CK names the technique but does not give the concrete commands, their order, or dependencies.</text>
    <text x="28" y="158" font-size="12.5" fill="#b91c1c">✗  That missing "how" is exactly the <tspan font-weight="800">procedural semantics gap</tspan> STICKS sets out to measure.</text>
  </g>
</svg>
