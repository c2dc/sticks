<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 388" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d6fe0"/>
      <stop offset="0.52" stop-color="#8b2fd6"/>
      <stop offset="1" stop-color="#e1322f"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrLoop" markerWidth="11" markerHeight="11" refX="7" refY="3.3" orient="auto">
      <path d="M0,0 L8,3.3 L0,6.6 Z" fill="#8b2fd6"/>
    </marker>
  </defs>
  <rect width="1360" height="388" fill="#ffffff"/>

  <!-- agent loop region highlight (operationalization to evaluation) -->
  <rect x="242" y="78" width="1070" height="204" rx="16" fill="#faf6ff" stroke="#8b2fd6" stroke-dasharray="6 5" stroke-width="1.5"/>
  <text x="254" y="96" font-size="11.5" font-weight="800" fill="#8b2fd6">Agent loop: operationalization, flow, environment, execution, evaluation</text>

  <!-- gradient track -->
  <rect x="40" y="60" width="1280" height="6" rx="3" fill="url(#g)" opacity="0.25"/>

  <!-- phase nodes -->
  <g font-size="12">
    <g transform="translate(40,104)">
      <rect width="186" height="150" rx="12" fill="#f6f8fc" stroke="#e2e8f0"/>
      <rect width="186" height="34" rx="12" fill="#1d6fe0"/>
      <circle cx="24" cy="17" r="7" fill="#ffffff"/>
      <text x="42" y="22" font-size="12.5" font-weight="800" fill="#ffffff">Input</text>
      <text x="14" y="58" font-size="11" font-weight="700" fill="#0f1726">Pick the target</text>
      <text x="14" y="76" font-size="10" fill="#64748b">STIX package +</text>
      <text x="14" y="91" font-size="10" fill="#64748b">campaign; read from</text>
      <text x="14" y="106" font-size="10" fill="#64748b">ingested databases</text>
      <text x="14" y="138" font-size="9" font-weight="700" fill="#1d6fe0">&#8594; initial context</text>
    </g>
    <g transform="translate(254,104)">
      <rect width="186" height="150" rx="12" fill="#faf3ff" stroke="#c9a8ef"/>
      <rect width="186" height="34" rx="12" fill="#4a57d6"/>
      <circle cx="24" cy="17" r="7" fill="#ffffff"/>
      <text x="42" y="22" font-size="12.5" font-weight="800" fill="#ffffff">Operationalization</text>
      <text x="14" y="58" font-size="11" font-weight="700" fill="#0f1726">Techniques to</text>
      <text x="14" y="76" font-size="10" fill="#64748b">Atomic commands;</text>
      <text x="14" y="91" font-size="10" fill="#64748b">derive environment</text>
      <text x="14" y="106" font-size="10" fill="#64748b">parameters</text>
      <text x="14" y="138" font-size="9" font-weight="700" fill="#4a57d6">&#8594; commands + params</text>
    </g>
    <g transform="translate(468,104)">
      <rect width="186" height="150" rx="12" fill="#faf3ff" stroke="#c9a8ef"/>
      <rect width="186" height="34" rx="12" fill="#6b43d6"/>
      <circle cx="24" cy="17" r="7" fill="#ffffff"/>
      <text x="42" y="22" font-size="12.5" font-weight="800" fill="#ffffff">Flow</text>
      <text x="14" y="58" font-size="11" font-weight="700" fill="#0f1726">Build the attack flow</text>
      <text x="14" y="76" font-size="10" fill="#64748b">exact | adapted |</text>
      <text x="14" y="91" font-size="10" fill="#64748b">created, with</text>
      <text x="14" y="106" font-size="10" fill="#64748b">provenance</text>
      <text x="14" y="138" font-size="9" font-weight="700" fill="#6b43d6">&#8594; the attack flow</text>
    </g>
    <g transform="translate(682,104)">
      <rect width="186" height="150" rx="12" fill="#faf3ff" stroke="#c9a8ef"/>
      <rect width="186" height="34" rx="12" fill="#8b2fd6"/>
      <circle cx="24" cy="17" r="7" fill="#ffffff"/>
      <text x="42" y="22" font-size="12.5" font-weight="800" fill="#ffffff">Environment</text>
      <text x="14" y="58" font-size="11" font-weight="700" fill="#0f1726">Provision the lab</text>
      <text x="14" y="76" font-size="10" fill="#64748b">catalog-first images;</text>
      <text x="14" y="91" font-size="10" fill="#64748b">egress open only</text>
      <text x="14" y="106" font-size="10" fill="#64748b">in this phase</text>
      <text x="14" y="138" font-size="9" font-weight="700" fill="#8b2fd6">&#8594; provisioned lab</text>
    </g>
    <g transform="translate(896,104)">
      <rect width="186" height="150" rx="12" fill="#faf3ff" stroke="#c9a8ef"/>
      <rect width="186" height="34" rx="12" fill="#b52e9e"/>
      <circle cx="24" cy="17" r="7" fill="#ffffff"/>
      <text x="42" y="22" font-size="12.5" font-weight="800" fill="#ffffff">Execution</text>
      <text x="14" y="58" font-size="11" font-weight="700" fill="#0f1726">Isolate, then run</text>
      <text x="14" y="76" font-size="10" fill="#64748b">Caldera runs the</text>
      <text x="14" y="91" font-size="10" fill="#64748b">commands on the</text>
      <text x="14" y="106" font-size="10" fill="#64748b">internal network</text>
      <text x="14" y="138" font-size="9" font-weight="700" fill="#b52e9e">&#8594; results + audit</text>
    </g>
    <g transform="translate(1110,104)">
      <rect width="186" height="150" rx="12" fill="#fdf2f1" stroke="#f0b7b5"/>
      <rect width="186" height="34" rx="12" fill="#e1322f"/>
      <circle cx="24" cy="17" r="7" fill="#ffffff"/>
      <text x="42" y="22" font-size="12.5" font-weight="800" fill="#ffffff">Evaluation</text>
      <text x="14" y="58" font-size="11" font-weight="700" fill="#0f1726">Judge the result</text>
      <text x="14" y="76" font-size="10" fill="#64748b">procedural</text>
      <text x="14" y="91" font-size="10" fill="#64748b">sufficiency;</text>
      <text x="14" y="106" font-size="10" fill="#64748b">finish or refine</text>
      <text x="14" y="138" font-size="9" font-weight="700" fill="#e1322f">&#8594; verdict</text>
    </g>
  </g>

  <!-- forward arrows -->
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="226" y1="179" x2="252" y2="179" marker-end="url(#arr)"/>
    <line x1="440" y1="179" x2="466" y2="179" marker-end="url(#arr)"/>
    <line x1="654" y1="179" x2="680" y2="179" marker-end="url(#arr)"/>
    <line x1="868" y1="179" x2="894" y2="179" marker-end="url(#arr)"/>
    <line x1="1082" y1="179" x2="1108" y2="179" marker-end="url(#arr)"/>
  </g>

  <!-- feedback loop arrow: from evaluation bottom back to operationalization bottom -->
  <path d="M1203,254 C1203,330 1203,350 1070,350 L480,350 C365,350 347,330 347,258"
        fill="none" stroke="#8b2fd6" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrLoop)"/>
  <g transform="translate(775,342)">
    <rect x="-200" y="-14" width="400" height="27" rx="8" fill="#ffffff" stroke="#e9d9fb"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">refine: the verdict routes a fix back to an earlier phase</text>
  </g>
</svg>