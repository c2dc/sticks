<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 388" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d6fe0"/>
      <stop offset="0.52" stop-color="#8b2fd6"/>
      <stop offset="1" stop-color="#e1322f"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrLoop" markerWidth="11" markerHeight="11" refX="7" refY="3.3" orient="auto">
      <path d="M0,0 L8,3.3 L0,6.6 Z" fill="#8b2fd6"/>
    </marker>
  </defs>
  <rect width="1360" height="388" fill="#ffffff"/>

  <!-- AI agent loop region highlight (stages 3..6) -->
  <rect x="456" y="78" width="848" height="204" rx="16" fill="#faf6ff" stroke="#8b2fd6" stroke-dasharray="6 5" stroke-width="1.5"/>
  <text x="468" y="96" font-size="11.5" font-weight="800" fill="#8b2fd6">AI agent plan, execute &amp; improve loop (future)</text>

  <!-- gradient track -->
  <rect x="40" y="60" width="1280" height="6" rx="3" fill="url(#g)" opacity="0.25"/>

  <!-- 6 stage nodes -->
  <g font-size="12">
    <g transform="translate(40,104)">
      <rect width="186" height="150" rx="12" fill="#f6f8fc" stroke="#e2e8f0"/>
      <rect width="186" height="34" rx="12" fill="#1d6fe0"/>
      <circle cx="26" cy="17" r="12" fill="#ffffff"/><text x="26" y="22" text-anchor="middle" font-size="14" font-weight="800" fill="#1d6fe0">1</text>
      <text x="48" y="22" font-size="12.5" font-weight="800" fill="#ffffff">STIX Base</text>
      <text x="14" y="58" font-size="11" font-weight="700" fill="#0f1726">Select bundle</text>
      <text x="14" y="76" font-size="10" fill="#64748b">download from</text>
      <text x="14" y="91" font-size="10" fill="#64748b">MITRE if absent;</text>
      <text x="14" y="106" font-size="10" fill="#64748b">bundle dashboard</text>
      <text x="14" y="138" font-size="9" font-weight="700" fill="#1d6fe0">&#8594; bundle on disk</text>
    </g>
    <g transform="translate(254,104)">
      <rect width="186" height="150" rx="12" fill="#f6f8fc" stroke="#e2e8f0"/>
      <rect width="186" height="34" rx="12" fill="#4a57d6"/>
      <circle cx="26" cy="17" r="12" fill="#ffffff"/><text x="26" y="22" text-anchor="middle" font-size="14" font-weight="800" fill="#4a57d6">2</text>
      <text x="48" y="22" font-size="12.5" font-weight="800" fill="#ffffff">Campaign</text>
      <text x="14" y="58" font-size="11" font-weight="700" fill="#0f1726">List campaigns;</text>
      <text x="14" y="76" font-size="10" fill="#64748b">pick one; extract</text>
      <text x="14" y="91" font-size="10" fill="#64748b">attributes &amp;</text>
      <text x="14" y="106" font-size="10" fill="#64748b">techniques</text>
      <text x="14" y="138" font-size="9" font-weight="700" fill="#4a57d6">&#8594; attributes</text>
    </g>
    <g transform="translate(468,104)">
      <rect width="186" height="150" rx="12" fill="#faf3ff" stroke="#c9a8ef"/>
      <rect width="186" height="34" rx="12" fill="#6b43d6"/>
      <circle cx="26" cy="17" r="12" fill="#ffffff"/><text x="26" y="22" text-anchor="middle" font-size="14" font-weight="800" fill="#6b43d6">3</text>
      <text x="48" y="22" font-size="12.5" font-weight="800" fill="#ffffff">DAG</text>
      <text x="14" y="58" font-size="11" font-weight="700" fill="#0f1726">Plan: build the</text>
      <text x="14" y="76" font-size="10" fill="#64748b">ordered graph of</text>
      <text x="14" y="91" font-size="10" fill="#64748b">techniques with</text>
      <text x="14" y="106" font-size="10" fill="#64748b">dependencies</text>
      <text x="14" y="138" font-size="9" font-weight="700" fill="#6b43d6">&#8594; the DAG</text>
    </g>
    <g transform="translate(682,104)">
      <rect width="186" height="150" rx="12" fill="#faf3ff" stroke="#c9a8ef"/>
      <rect width="186" height="34" rx="12" fill="#8b2fd6"/>
      <circle cx="26" cy="17" r="12" fill="#ffffff"/><text x="26" y="22" text-anchor="middle" font-size="14" font-weight="800" fill="#8b2fd6">4</text>
      <text x="48" y="22" font-size="12.5" font-weight="800" fill="#ffffff">Operational.</text>
      <text x="14" y="58" font-size="11" font-weight="700" fill="#0f1726">Build commands</text>
      <text x="14" y="76" font-size="10" fill="#64748b">in DAG order +</text>
      <text x="14" y="91" font-size="10" fill="#64748b">derive env.</text>
      <text x="14" y="106" font-size="10" fill="#64748b">parameters</text>
      <text x="14" y="138" font-size="9" font-weight="700" fill="#8b2fd6">&#8594; cmds + params</text>
    </g>
    <g transform="translate(896,104)">
      <rect width="186" height="150" rx="12" fill="#faf3ff" stroke="#c9a8ef"/>
      <rect width="186" height="34" rx="12" fill="#b52e9e"/>
      <circle cx="26" cy="17" r="12" fill="#ffffff"/><text x="26" y="22" text-anchor="middle" font-size="14" font-weight="800" fill="#b52e9e">5</text>
      <text x="48" y="22" font-size="12.5" font-weight="800" fill="#ffffff">Environment</text>
      <text x="14" y="58" font-size="11" font-weight="700" fill="#0f1726">Provision lab;</text>
      <text x="14" y="76" font-size="10" fill="#64748b">load Abilities</text>
      <text x="14" y="91" font-size="10" fill="#64748b">into Caldera;</text>
      <text x="14" y="106" font-size="10" fill="#64748b">verify isolation</text>
      <text x="14" y="138" font-size="9" font-weight="700" fill="#b52e9e">&#8594; isolated lab</text>
    </g>
    <g transform="translate(1110,104)">
      <rect width="186" height="150" rx="12" fill="#fdf2f1" stroke="#f0b7b5"/>
      <rect width="186" height="34" rx="12" fill="#e1322f"/>
      <circle cx="26" cy="17" r="12" fill="#ffffff"/><text x="26" y="22" text-anchor="middle" font-size="14" font-weight="800" fill="#e1322f">6</text>
      <text x="48" y="22" font-size="12.5" font-weight="800" fill="#ffffff">Exec + Report</text>
      <text x="14" y="58" font-size="11" font-weight="700" fill="#0f1726">Run (contained);</text>
      <text x="14" y="76" font-size="10" fill="#64748b">measure</text>
      <text x="14" y="91" font-size="10" fill="#64748b">sufficiency;</text>
      <text x="14" y="106" font-size="10" fill="#64748b">report; teardown</text>
      <text x="14" y="138" font-size="9" font-weight="700" fill="#e1322f">&#8594; report + verdict</text>
    </g>
  </g>

  <!-- forward arrows -->
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="226" y1="179" x2="252" y2="179" marker-end="url(#arr)"/>
    <line x1="440" y1="179" x2="466" y2="179" marker-end="url(#arr)"/>
    <line x1="654" y1="179" x2="680" y2="179" marker-end="url(#arr)"/>
    <line x1="868" y1="179" x2="894" y2="179" marker-end="url(#arr)"/>
    <line x1="1082" y1="179" x2="1108" y2="179" marker-end="url(#arr)"/>
  </g>

  <!-- feedback loop arrow: from stage 6 bottom back to stage 3 bottom -->
  <path d="M1203,254 C1203,330 1203,350 1070,350 L695,350 C580,350 561,330 561,258"
        fill="none" stroke="#8b2fd6" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrLoop)"/>
  <g transform="translate(882,342)">
    <rect x="-186" y="-14" width="372" height="27" rx="8" fill="#ffffff" stroke="#e9d9fb"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">feedback: metrics &amp; verdict refine the next plan</text>
  </g>
</svg>