<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/sticks-favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pipeline UI — sticks</title>
    <!--
      Aplica o tema ANTES do React montar, para não haver "flash" de tema claro
      ao recarregar a página. A ordem é: escolha explícita salva localmente,
      senão a preferência do sistema (prefers-color-scheme), senão Modo_Claro.
      Precisa ficar em sincronia com src/lib/theme-storage.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("sticks.tema");
          var isDark =
            stored === "escuro" ||
            (stored !== "claro" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {
          /* storage/matchMedia indisponível: mantém o padrão (Modo_Claro). */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
